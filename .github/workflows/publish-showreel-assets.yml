name: Publish verified showreel assets
on:
  push:
    paths:
      - ".github/workflows/publish-showreel-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: showreel-assets-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and checksum-verify tested assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --silent --show-error \
            'https://sb-55l6uyvaj1ls.vercel.run/showreel-patch.tar.gz' \
            -o /tmp/showreel-patch.tar.gz
          printf '%s  %s\n' '564e2ada30da7b672bd29497eb081ae241498e37cd4b93bacf27517f32040c1c' '/tmp/showreel-patch.tar.gz' | sha256sum --check -
          tar -tzf /tmp/showreel-patch.tar.gz | grep -v '^$' > /tmp/showreel-contents.txt
          if grep -E '(^/|\.\./|(^|/)\.git(/|$))' /tmp/showreel-contents.txt; then
            echo 'Unsafe tarball path detected'; exit 1
          fi
          tar -xzf /tmp/showreel-patch.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Validate 22 complete EN/PT narration masters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for lang in ('en','pt'):
              for idx in range(11):
                  file=Path('frontend/public/reel/vo')/lang/f'{idx}.mp3'
                  data=file.read_bytes()
                  assert len(data)>5000, f'{file} is truncated'
                  assert data[:3]==b'ID3' or (data[0]==255 and data[1]&224==224), f'{file} is not MP3'
          print('Verified all 22 complete voice masters')
          PY
      - name: Commit tested film and audio fixes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MOTION_VERSIONS.md frontend/api/reel/narration.js 'frontend/api/reel/vo/[lang]/[idx].js' frontend/src/components/reel/Controls.jsx frontend/src/components/reel/Stage.jsx frontend/src/hooks/useReel.js frontend/src/pages/ReelStudio.jsx frontend/src/reel/audio.js frontend/src/reel/engine.js frontend/src/reel/voices.test.js frontend/public/reel/vo/
          git diff --cached --check
          git commit -m 'fix(showreel): reliable EN/PT audio masters and verified 1080p download UI'
          git push origin HEAD:main
