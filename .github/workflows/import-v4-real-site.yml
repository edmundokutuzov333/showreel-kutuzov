name: Import verified V4 real-site film
on:
  push:
    paths:
      - '.github/workflows/import-v4-real-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch site recording from staging
        shell: bash
        env:
          SOURCE_URL: 'https://pikaso.cdnpk.net/private/production/6020824673/video.mp4?token=exp=1794700800~hmac=a8530cdc27c96a17d8d9fe5a8ce6aeb71dd4b55c6a8bdb774908bf5153d66949'
        run: |
          set -euo pipefail
          mkdir -p frontend/public/v4
          curl --fail --location --retry 3 --retry-all-errors --max-time 120 "$SOURCE_URL" --output frontend/public/v4/V4_REAL_SITE_30S.mp4
          printf '%s  %s\n' '83a1eecbc614bd41a872bcc04044addba0469c21dd4f29fb120c947988dbdf1c' 'frontend/public/v4/V4_REAL_SITE_30S.mp4' | sha256sum --check --
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json frontend/public/v4/V4_REAL_SITE_30S.mp4
          fi
      - name: Commit verified video to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/v4/V4_REAL_SITE_30S.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v4): add verified real website screen recording (30s)'
            git push origin HEAD:main
          fi
